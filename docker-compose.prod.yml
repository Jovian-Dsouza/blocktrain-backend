# Production Docker Compose configuration
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blocktrain-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blocktrain}
      POSTGRES_USER: ${POSTGRES_USER:-blocktrain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - blocktrain-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blocktrain_user} -d ${POSTGRES_DB:-blocktrain}"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Remove port exposure for production security
    # ports:
    #   - "5432:5432"

  app:
    build: .
    container_name: blocktrain-app-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-blocktrain_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blocktrain}?schema=public"
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - blocktrain-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_prod_data:
    driver: local

networks:
  blocktrain-network:
    driver: bridge
